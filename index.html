<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | ProvoConnect</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="auth">
  <div class="auth-box">
    <div class="logo">PC</div>
    <h1 class="center">ProvoConnect</h1>
    <p class="center muted">Less scrolling. More living.</p>

    <input type="radio" name="auth" id="tab-in" checked hidden>
    <input type="radio" name="auth" id="tab-up" hidden>
    <div class="seg"><label for="tab-in">Sign in</label><label for="tab-up">Sign up</label></div>

    <div class="auth-form form-in">
      <div class="field"><label for="in-email">Email</label><input id="in-email" type="email" autocomplete="email"></div>
      <div class="field"><label for="in-pass">Password</label><input id="in-pass" type="password" autocomplete="current-password"></div>
      <label class="check field"><input type="checkbox" checked> Keep me signed in</label>
      <a href="home.html" class="btn btn-primary btn-block">Sign in</a>
      <p class="center small" style="margin-top:12px"><a href="#">Forgot password?</a></p>
    </div>

    <div class="auth-form form-up">
      <div class="field"><label for="up-name">First name</label><input id="up-name" type="text" autocomplete="given-name"></div>
      <div class="field"><label for="up-email">Email</label><input id="up-email" type="email" autocomplete="email"></div>
      <div class="field"><label for="up-pass">Password</label><input id="up-pass" type="password" autocomplete="new-password"></div>
      <div class="two-col">
        <div class="field"><label for="up-bday">Birthday</label><input id="up-bday" type="date"></div>
        <div class="field"><label for="up-city">City</label><input id="up-city" type="text" placeholder="Provo"></div>
      </div>
      <label class="check field"><input type="checkbox"> I agree to the terms and community guidelines</label>
      <a href="home.html" class="btn btn-primary btn-block">Create account</a>
    </div>

    <p class="note">Mock: both buttons go straight to Home. In the real app this screen is skipped when valid credentials are saved.</p>
  </div>
</main>
</body>
</html>
